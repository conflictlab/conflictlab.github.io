name: Monthly PACE Forecasts (Parallel)

on:
  schedule:
    - cron: '0 2 1 * *'  # 1st of every month at 2:00 AM UTC
  workflow_dispatch:

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Pace-map-risk subrepository
        run: |
          git clone https://github.com/conflictlab/Pace-map-risk.git Pace-map-risk-temp
          cp -r Pace-map-risk-temp/* Pace-map-risk/ || true
          rm -rf Pace-map-risk-temp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd Pace-map-risk
          pip install --upgrade pip
          pip install pandas numpy geopandas matplotlib seaborn shapely scipy scikit-learn
          pip install -r requirements.txt || true

      - name: Download and process UCDP data
        run: |
          cd Pace-map-risk
          python ../scripts/parallel/prepare_data.py

      - name: Save processed data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: |
            Pace-map-risk/Conf.csv
            Pace-map-risk/reg_coun.csv
            Pace-map-risk/shape.py
            Pace-map-risk/generate_forecasts.py
          retention-days: 1

  generate-h6:
    needs: prepare-data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: [0, 1, 2, 3]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Pace-map-risk subrepository
        run: |
          git clone https://github.com/conflictlab/Pace-map-risk.git Pace-map-risk-temp
          cp -r Pace-map-risk-temp/* Pace-map-risk/ || true
          rm -rf Pace-map-risk-temp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd Pace-map-risk
          pip install --upgrade pip
          pip install pandas numpy geopandas matplotlib seaborn shapely scipy scikit-learn
          pip install -r requirements.txt || true

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: Pace-map-risk/

      - name: Generate h=6 forecasts for chunk ${{ matrix.chunk }}
        run: |
          cd Pace-map-risk
          python ../scripts/parallel/generate_chunk.py 6 ${{ matrix.chunk }} 4
        timeout-minutes: 90

      - name: Upload h6 chunk results
        uses: actions/upload-artifact@v4
        with:
          name: h6-chunk-${{ matrix.chunk }}
          path: |
            Pace-map-risk/forecasts_h6_chunk${{ matrix.chunk }}.csv
            Pace-map-risk/forecasts_h6_min_chunk${{ matrix.chunk }}.csv
            Pace-map-risk/forecasts_h6_max_chunk${{ matrix.chunk }}.csv
            Pace-map-risk/perc_h6_chunk${{ matrix.chunk }}.csv
            Pace-map-risk/dict_m_h6_chunk${{ matrix.chunk }}.pkl
            Pace-map-risk/dict_sce_h6_chunk${{ matrix.chunk }}.pkl
            Pace-map-risk/sce_dictionary_h6_chunk${{ matrix.chunk }}.pkl
          retention-days: 1

  generate-h12:
    needs: prepare-data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: [0, 1, 2, 3]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Pace-map-risk subrepository
        run: |
          git clone https://github.com/conflictlab/Pace-map-risk.git Pace-map-risk-temp
          cp -r Pace-map-risk-temp/* Pace-map-risk/ || true
          rm -rf Pace-map-risk-temp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd Pace-map-risk
          pip install --upgrade pip
          pip install pandas numpy geopandas matplotlib seaborn shapely scipy scikit-learn
          pip install -r requirements.txt || true

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: Pace-map-risk/

      - name: Generate h=12 forecasts for chunk ${{ matrix.chunk }}
        run: |
          cd Pace-map-risk
          python ../scripts/parallel/generate_chunk.py 12 ${{ matrix.chunk }} 4
        timeout-minutes: 90

      - name: Upload h12 chunk results
        uses: actions/upload-artifact@v4
        with:
          name: h12-chunk-${{ matrix.chunk }}
          path: |
            Pace-map-risk/forecasts_h12_chunk${{ matrix.chunk }}.csv
            Pace-map-risk/forecasts_h12_min_chunk${{ matrix.chunk }}.csv
            Pace-map-risk/forecasts_h12_max_chunk${{ matrix.chunk }}.csv
            Pace-map-risk/perc_h12_chunk${{ matrix.chunk }}.csv
            Pace-map-risk/dict_sce_h12_chunk${{ matrix.chunk }}.pkl
            Pace-map-risk/sce_dictionary_h12_chunk${{ matrix.chunk }}.pkl
          retention-days: 1

  merge-and-publish:
    needs: [generate-h6, generate-h12]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Download all h6 chunks
        uses: actions/download-artifact@v4
        with:
          pattern: h6-chunk-*
          path: h6-chunks/
          merge-multiple: true

      - name: Download all h12 chunks
        uses: actions/download-artifact@v4
        with:
          pattern: h12-chunk-*
          path: h12-chunks/
          merge-multiple: true

      - name: Download processed data for Hist.csv
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/

      - name: Merge h=6 results
        run: python scripts/parallel/merge_results.py 6 4

      - name: Merge h=12 results
        run: python scripts/parallel/merge_results.py 12 4

      - name: Create Hist.csv and metadata
        run: python scripts/parallel/create_metadata.py

      - name: Prepare output directories
        run: |
          ARCHIVE_DIR="public/data/forecasts/archive/$(date +%Y-%m)"
          mkdir -p public/data/forecasts/latest
          mkdir -p "$ARCHIVE_DIR"
          echo "ARCHIVE_DIR=$ARCHIVE_DIR" >> $GITHUB_ENV

      - name: Copy forecasts to latest
        run: |
          cp Hist.csv public/data/forecasts/latest/
          cp forecasts_h6.csv public/data/forecasts/latest/
          cp forecasts_h6_min.csv public/data/forecasts/latest/
          cp forecasts_h6_max.csv public/data/forecasts/latest/
          cp forecasts_h12.csv public/data/forecasts/latest/
          cp forecasts_h12_min.csv public/data/forecasts/latest/
          cp forecasts_h12_max.csv public/data/forecasts/latest/
          cp forecast_metadata.json public/data/forecasts/latest/metadata.json
          cp Pred_df.csv public/data/forecasts/latest/
          cp Pred_df_min.csv public/data/forecasts/latest/
          cp Pred_df_max.csv public/data/forecasts/latest/
          cp perc.csv public/data/forecasts/latest/
          cp saved_dictionary.pkl public/data/forecasts/latest/ || true
          cp dict_sce.pkl public/data/forecasts/latest/ || true
          cp sce_dictionary.pkl public/data/forecasts/latest/ || true

      - name: Archive forecasts
        run: |
          cp Hist.csv "$ARCHIVE_DIR/"
          cp forecasts_h6.csv "$ARCHIVE_DIR/"
          cp forecasts_h6_min.csv "$ARCHIVE_DIR/"
          cp forecasts_h6_max.csv "$ARCHIVE_DIR/"
          cp forecasts_h12.csv "$ARCHIVE_DIR/"
          cp forecasts_h12_min.csv "$ARCHIVE_DIR/"
          cp forecasts_h12_max.csv "$ARCHIVE_DIR/"
          cp forecast_metadata.json "$ARCHIVE_DIR/metadata.json"

      - name: Commit and push forecast data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/forecasts/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): update monthly forecasts for $(date +%Y-%m) (parallel)

          - Generated h=6 and h=12 month forecasts in parallel
          - Updated historical data through $(date +%Y-%m)
          - Archived previous forecasts
          - Used matrix parallelization for faster execution

          🤖 Generated with GitHub Actions"
            git push
          fi

      - name: Upload forecast artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forecasts-${{ github.run_number }}
          path: |
            public/data/forecasts/latest/
            public/data/forecasts/archive/
          retention-days: 90

      - name: Create summary
        run: |
          echo "## 📊 Parallel Forecast Generation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Generated forecasts for $(date +%Y-%m)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Parallelization" >> $GITHUB_STEP_SUMMARY
          echo "- Used 4 parallel workers per horizon (h=6 and h=12)" >> $GITHUB_STEP_SUMMARY
          echo "- Total: 8 parallel jobs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output Files" >> $GITHUB_STEP_SUMMARY
          echo "- 6-month forecasts: \`forecasts_h6.csv\`" >> $GITHUB_STEP_SUMMARY
          echo "- 12-month forecasts: \`forecasts_h12.csv\`" >> $GITHUB_STEP_SUMMARY
          echo "- Historical data: \`Hist.csv\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access URLs" >> $GITHUB_STEP_SUMMARY
          echo "- Latest: https://conflictlab.github.io/data/forecasts/latest/" >> $GITHUB_STEP_SUMMARY
          echo "- Archive: https://conflictlab.github.io/data/forecasts/archive/$(date +%Y-%m)/" >> $GITHUB_STEP_SUMMARY
