name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'public/**'
      - 'lib/**'
      - 'scripts/**'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'public/**'
      - 'lib/**'
      - 'scripts/**'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - '.github/workflows/deploy-pages.yml'
  # Also deploy when data update workflows complete (their pushes use GITHUB_TOKEN and won't trigger push workflows)
  workflow_run:
    workflows:
      - "Sync Forecast CSVs"
      - "Update minmax and denorm scenarios"
      - "Update DTW matches JSON"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "base=" >> $GITHUB_OUTPUT
          else
            echo "base=/$repo" >> $GITHUB_OUTPUT
          fi

      - name: Generate grid CSV assets
        run: |
          set -e
          # Generate combined CSVs for all available GeoJSON periods
          for f in public/data/grid/*.geo.json; do
            [ -e "$f" ] || continue
            per=$(basename "$f" .geo.json)
            echo "Building combined CSV for $per"
            node scripts/grid-geojson-to-csv.js --period "$per" || true
          done

      - name: Export static API endpoints
        run: node scripts/export-static-api.js

      - name: Ensure status.json exists/updated
        run: node scripts/generate-status.js || true

      - name: Generate per-month grid CSVs
        run: |
          # Generate per-month CSVs (m1..m6) for all available monthly JSON periods
          for m in public/data/grid/*-m1.json; do
            [ -e "$m" ] || continue
            per=$(basename "${m%-m1.json}")
            echo "Building monthly CSVs for $per"
            node scripts/grid-month-points-to-csv.js --period "$per" || true
          done

      - name: Remove API routes for static export
        run: rm -rf app/api

      - name: Build (Next.js export + data prebuild)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.base }}
          BASE_PATH: ${{ steps.base.outputs.base }}
          NEXT_PUBLIC_SITE_URL: https://forecastlab.org
          SKIP_PREBUILD: '1'
        run: |
          set -e
          npm run build
          # Some Next versions may not emit ./out automatically; ensure export
          if [ ! -d "out" ]; then
            npx next export -o out
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send success email
        if: ${{ success() && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' && secrets.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Deploy succeeded: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Deploy to GitHub Pages</strong> completed successfully.</p>
            <p>URL: ${{ steps.deployment.outputs.page_url }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>

      - name: Send failure email
        if: ${{ failure() && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' && secrets.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Deploy FAILED: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Deploy to GitHub Pages</strong> failed.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View failed run</a></p>
