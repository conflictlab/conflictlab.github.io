name: Sync Forecast CSVs

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'content/forecasts/**'
      - 'content/priogrid_cellshp/**'
      - 'package.json'
      - 'app/forecasts-grid/**'
      - 'components/PrioGridMap.tsx'
      - '.github/workflows/sync-forecasts.yml'
  schedule:
    # Run at 03:00 UTC on 28th (pre-month) and 1st (fallback)
    - cron: '0 3 28 * *'
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-forecasts
      cancel-in-progress: true
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync forecasts from GitHub CSVs (conflictlab)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run csv:sync:github -- \
            --repo conflictlab/Pace-map-risk \
            --dir '' \
            --branch main \
            --latestOnly \
            --saveCsv \
            --token $GITHUB_TOKEN
      - name: Build PRIO-GRID centroids from shapefile
        run: npm run grid:centroids
      - name: Build PRIO-GRID GeoJSON from live CSV
        run: npm run grid:build

      - name: Build monthly point JSONs
        run: node scripts/geojson-to-month-points.js

      - name: Build grid CSV for current period
        run: node scripts/grid-geojson-to-csv.js

      - name: Build per-month grid CSVs (m1..m6)
        run: node scripts/grid-month-points-to-csv.js

      - name: Generate per-country grid files
        run: node scripts/generate-country-grids.js

      - name: Export static API for grid points
        run: node scripts/export-static-api.js

      - name: Generate status JSON
        run: node scripts/generate-status.js

      - name: Commit changes (if any)
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add content/forecasts public/data/csv public/data/grid public/api public/status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync forecasts + grid assets (centroids, geojson, monthly points)"
          fi
          # Rebase on latest main to avoid non-fast-forward push failures
          git fetch origin main
          if ! git pull --rebase origin main; then
            echo "Rebase failed; aborting rebase and skipping push to avoid conflicts." >&2
            git rebase --abort || true
            exit 1
          fi
          # Push rebased commit (or no-op if nothing changed)
          git push origin HEAD:main

      - name: Send failure email
        if: ${{ failure() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.MAIL_TO != '' && env.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || 465 }}
          secure: ${{ env.SMTP_SECURE == 'true' }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "❌ Sync forecasts FAILED: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ env.MAIL_TO }}
          from: ${{ env.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Sync Forecast CSVs</strong> failed.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View failed run</a></p>
