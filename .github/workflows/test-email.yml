name: Test Email

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipients (comma-separated). Leave empty to use MAIL_TO secret"
        required: false
        default: ""
      from:
        description: "From address (optional, defaults to MAIL_FROM or SMTP_USERNAME)"
        required: false
        default: ""
      subject:
        description: "Email subject (optional)"
        required: false
        default: ""
      body:
        description: "Email body (optional)"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          missing=()
          [ -z "${{ secrets.SMTP_SERVER }}" ] && missing+=(SMTP_SERVER)
          [ -z "${{ secrets.SMTP_USERNAME }}" ] && missing+=(SMTP_USERNAME)
          [ -z "${{ secrets.SMTP_PASSWORD }}" ] && missing+=(SMTP_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare mail parameters
        id: prep
        env:
          INPUT_TO: ${{ inputs.to }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_SUBJECT: ${{ inputs.subject }}
          INPUT_BODY: ${{ inputs.body }}
          SECRET_TO: ${{ secrets.MAIL_TO }}
          SECRET_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -e
          to="${INPUT_TO:-${SECRET_TO}}"
          if [ -z "$to" ]; then
            echo "No recipients provided. Set 'to' input or MAIL_TO secret." >&2
            exit 1
          fi
          from="${INPUT_FROM:-${SECRET_FROM:-$SMTP_USERNAME}}"
          subject="${INPUT_SUBJECT:-Test email from ${REPO} #${RUN_NUMBER}}"
          body="${INPUT_BODY:-This is a test email from ${REPO} run #${RUN_NUMBER} (${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})}"
          {
            echo "to=$to"
            echo "from=$from"
            echo "subject<<EOT"
            echo "$subject"
            echo "EOT"
            echo "body<<EOT"
            echo "$body"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"

      - name: Send test email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.prep.outputs.subject }}
          to: ${{ steps.prep.outputs.to }}
          from: ${{ steps.prep.outputs.from }}
          content_type: text/plain
          body: ${{ steps.prep.outputs.body }}
