name: Update minmax and denorm scenarios

on:
  schedule:
    - cron: '0 3 26 * *' # early run on the 26th at 03:00 UTC
    - cron: '0 3 28 * *' # second early run on the 28th at 03:00 UTC
    - cron: '0 3 1 * *'  # fallback on the 1st at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.4" "pandas==1.5.3"

      - name: Download scenarios pickle (sce_dictionary.pkl)
        run: |
          set -e
          REPO="${{ vars.SCE_REPO }}"; REPO="${REPO:-conflictlab/Pace-map-risk}"
          BRANCH="${{ vars.SCE_BRANCH }}"; BRANCH="${BRANCH:-main}"
          PATH_IN_REPO="${{ vars.SCE_PATH }}"; PATH_IN_REPO="${PATH_IN_REPO:-sce_dictionary.pkl}"
          URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH_IN_REPO}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o sce_dictionary.pkl

      - name: Convert scenarios pickle to JSON
        run: npm run scenarios:convert -- --src sce_dictionary.pkl --out public/data/scenarios.json

      - name: Build minmax and denormalized scenarios
        run: npm run data:update

      - name: Generate status JSON
        run: node scripts/generate-status.js

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/minmax.json public/data/scenarios.json public/data/scenarios.denorm.json public/status.json
          if [ -f public/data/hist.csv ]; then
            git add public/data/hist.csv
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): update hist minmax and denormalized scenarios"
            git push
          fi

      - name: Send success email
        if: ${{ success() && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' && secrets.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Update minmax/scenarios succeeded: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Update minmax and scenarios</strong> completed successfully.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
            <p>Commit: ${{ github.sha }}</p>
            <p>Ref: ${{ github.ref }}</p>

      - name: Send failure email
        if: ${{ failure() && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' && secrets.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Update minmax/scenarios FAILED: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Update minmax and scenarios</strong> failed.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View failed run</a></p>
            <p>Commit: ${{ github.sha }}</p>
            <p>Ref: ${{ github.ref }}</p>
