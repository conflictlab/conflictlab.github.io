name: Refresh Website Now

on:
  schedule:
    - cron: '0 3 27 * *' # 27th at 03:00 UTC (pre-month, after UCDP release)
    - cron: '0 3 1 * *'  # 1st at 03:00 UTC
  workflow_dispatch:
    inputs:
      skipWait:
        description: "Skip wait-for-compute (useful if compute already finished)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Wait for compute run (forecast_metadata fresh)
        if: ${{ inputs.skipWait != 'true' }}
        env:
          REPO: conflictlab/Pace-map-risk
        run: |
          set -e
          ATTEMPTS=18 # up to ~90 minutes
          URL="https://raw.githubusercontent.com/${REPO}/main/forecast_metadata.json"
          for i in $(seq 1 $ATTEMPTS); do
            code=$(curl -s -o /tmp/forecast_meta.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then
              # Extract run_date and parse it (handles microseconds)
              run_date=$(jq -r '.run_date // ""' /tmp/forecast_meta.json 2>/dev/null || echo "")
              if [ -n "$run_date" ] && [ "$run_date" != "null" ]; then
                # Strip microseconds if present, convert to epoch
                clean_date=$(echo "$run_date" | sed 's/\.[0-9]*$//')
                ts=$(date -d "$clean_date" +%s 2>/dev/null || echo "")
                if [ -n "$ts" ]; then
                  now=$(date -u +%s)
                  age_min=$(( (now - ts) / 60 ))
                else
                  age_min=999999
                fi
              else
                age_min=999999
              fi
            else
              age_min=999999
            fi
            if [ "$age_min" -le 480 ]; then echo "Compute fresh (age ${age_min} min)."; break; fi
            echo "Waiting for compute (attempt $i/$ATTEMPTS) — current age ${age_min} min"; sleep 300
          done

      - name: Validate UCDP data is non-zero
        env:
          REPO: conflictlab/Pace-map-risk
        run: |
          set -e
          echo "Downloading Hist.csv to validate data quality..."
          URL="https://raw.githubusercontent.com/${REPO}/main/Hist.csv"
          curl -fsSL "$URL" -o /tmp/hist_check.csv

          # Get the last line of data (skip header)
          last_line=$(tail -n 1 /tmp/hist_check.csv)

          # Sum all numeric values in the last row (skip first column which is date)
          # Remove commas, extract numbers, sum them
          total=$(echo "$last_line" | cut -d',' -f2- | tr ',' '\n' | grep -E '^[0-9]+(\.[0-9]+)?$' | awk '{sum+=$1} END {print sum}')

          echo "Total fatalities in last month: $total"

          # If total is 0 or empty, the data is bad
          if [ -z "$total" ] || [ "$(echo "$total == 0" | bc -l 2>/dev/null || echo "0")" = "1" ]; then
            echo "ERROR: UCDP data for the latest month appears to be all zeros!"
            echo "This likely means UCDP has not released data yet."
            echo "Aborting to prevent corrupted forecasts."
            exit 1
          fi

          echo "✓ Data validation passed - latest month has $total total fatalities"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.4" "pandas==1.5.3"

      - name: Sync forecasts from GitHub CSVs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run csv:sync:github -- \
            --repo conflictlab/Pace-map-risk \
            --dir '' \
            --branch main \
            --latestOnly \
            --saveCsv \
            --token $GITHUB_TOKEN

      - name: Build PRIO-GRID centroids
        run: npm run grid:centroids

      - name: Build PRIO-GRID GeoJSON
        run: npm run grid:build

      - name: Build monthly point JSONs
        run: node scripts/geojson-to-month-points.js

      - name: Build grid CSV for current period
        run: node scripts/grid-geojson-to-csv.js

      - name: Build per-month grid CSVs (m1..m6)
        run: node scripts/grid-month-points-to-csv.js

      - name: Generate per-country grid files
        run: node scripts/generate-country-grids.js

      - name: Export static API for grid points
        run: node scripts/export-static-api.js

      - name: Download scenarios pickle
        run: |
          set -e
          REPO="${{ vars.SCE_REPO }}"; REPO="${REPO:-conflictlab/Pace-map-risk}"
          BRANCH="${{ vars.SCE_BRANCH }}"; BRANCH="${BRANCH:-main}"
          PATH_IN_REPO="${{ vars.SCE_PATH }}"; PATH_IN_REPO="${PATH_IN_REPO:-sce_dictionary.pkl}"
          URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH_IN_REPO}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o sce_dictionary.pkl

      - name: Convert scenarios to JSON
        run: npm run scenarios:convert -- --src sce_dictionary.pkl --out public/data/scenarios.json

      - name: Build minmax and denormalized scenarios
        run: npm run data:update

      - name: Download matches pickle
        run: |
          set -e
          REPO="${{ vars.MATCHES_REPO }}"; REPO="${REPO:-conflictlab/Pace-map-risk}"
          BRANCH="${{ vars.MATCHES_BRANCH }}"; BRANCH="${BRANCH:-main}"
          PATH_IN_REPO="${{ vars.MATCHES_PATH }}"; PATH_IN_REPO="${PATH_IN_REPO:-saved_dictionary.pkl}"
          URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH_IN_REPO}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o matches.pkl

      - name: Convert matches to JSON
        run: npm run matches:convert -- --src matches.pkl --out public/data/matches.json

      - name: Mirror forecast CSVs with 'date' column (site-hosted)
        run: node scripts/mirror-forecasts-with-dates.js

      - name: Sync all Historical_Predictions to archive
        run: node scripts/sync-historical-archive.js

      - name: Package monthly ZIP bundle
        run: |
          set -e
          # Determine period from latest metadata
          per=$(jq -r '.forecast_start_date // .data_end_date' public/data/forecasts/latest/metadata.json)
          if [ -z "$per" ] || [ "$per" = "null" ]; then
            echo "Could not determine period; skipping zip"
          else
            ARCH_DIR="public/data/forecasts/archive/$per"
            cd "$ARCH_DIR"
            zip -q -9 "forecasts-$per.zip" \
              forecasts_h6.csv forecasts_h6_min.csv forecasts_h6_max.csv \
              forecasts_h12.csv forecasts_h12_min.csv forecasts_h12_max.csv \
              Hist.csv metadata.json || true
            echo "Created $ARCH_DIR/forecasts-$per.zip"
          fi

      - name: Fetch latest newsletter from forecasting repo (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OWNER=conflictlab
          REPO=Pace-map-risk

          # Fetch Report.pdf from assets/ directory
          report_url="https://raw.githubusercontent.com/$OWNER/$REPO/main/assets/Report.pdf"
          echo "Fetching newsletter from $report_url"

          # Get current forecast period from metadata to name the file
          if [ -f public/data/forecasts/latest/metadata.json ]; then
            period=$(jq -r '.forecast_start_date // .data_end_date' public/data/forecasts/latest/metadata.json 2>/dev/null || echo "")
          fi

          # If we have a period, parse month and year for filename
          if [ -n "$period" ]; then
            year=$(echo "$period" | cut -d'-' -f1)
            month_num=$(echo "$period" | cut -d'-' -f2)
            case $month_num in
              01) month="January";;
              02) month="February";;
              03) month="March";;
              04) month="April";;
              05) month="May";;
              06) month="June";;
              07) month="July";;
              08) month="August";;
              09) month="September";;
              10) month="October";;
              11) month="November";;
              12) month="December";;
              *) month="Unknown";;
            esac
            filename="ForecastingReport_${month} ${year}.pdf"
          else
            # Fallback to current date
            filename="ForecastingReport_$(date +"%B %Y").pdf"
          fi

          mkdir -p public/newslettersAndReports
          curl -sSL "$report_url" -o "public/newslettersAndReports/$filename" || {
            echo "Warning: failed to download newsletter from $report_url"
            exit 0
          }
          echo "Downloaded newsletter as: $filename"

      - name: Generate status JSON
        run: node scripts/generate-status.js

      - name: Fail if missing active countries in snapshot
        run: |
          set -e
          if [ ! -f public/status.json ]; then
            echo "status.json not found" >&2; exit 1
          fi
          COUNT=$(jq -r '.summary.missingActiveCount // 0' public/status.json)
          if [ "$COUNT" != "0" ]; then
            echo "❌ Missing active countries in snapshot: $COUNT" >&2
            jq -r '.missingActiveEntities[:20] | join(", ")' public/status.json
            exit 1
          fi
          echo "✅ Snapshot completeness OK"

      - name: Commit and push updates
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # Stage all tracked changes produced by this job
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: monthly website refresh (forecasts, grid, scenarios, matches, API, status)"
          fi
          git fetch origin main
          # Attempt rebase with autostash; fall back to manual conflict resolution if needed
          if ! git -c rebase.autoStash=true pull --rebase origin main; then
            echo "Rebase failed; attempting manual conflict resolution" >&2
            # Check if we're in a rebase state
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              # Resolve all conflicts by accepting our changes (--theirs in rebase context means ours)
              git diff --name-only --diff-filter=U | while read file; do
                echo "Resolving conflict in $file (keeping our version)"
                git checkout --ours "$file"
              done
              git add -A
              git rebase --continue || {
                echo "Rebase continue failed; aborting" >&2
                git rebase --abort || true
                exit 1
              }
            else
              echo "Not in rebase state; aborting" >&2
              exit 1
            fi
          fi
          git push origin HEAD:main

      - name: Send success email
        if: ${{ success() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.MAIL_TO != '' && env.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || 465 }}
          secure: ${{ env.SMTP_SECURE == 'true' }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "✅ Refresh Website Now succeeded: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ env.MAIL_TO }}
          from: ${{ env.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Refresh Website Now</strong> completed successfully.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>

      - name: Send failure email
        if: ${{ failure() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.MAIL_TO != '' && env.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || 465 }}
          secure: ${{ env.SMTP_SECURE == 'true' }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "❌ Refresh Website Now FAILED: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ env.MAIL_TO }}
          from: ${{ env.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Refresh Website Now</strong> failed.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View failed run</a></p>
