name: Update DTW matches JSON

on:
  schedule:
    - cron: '0 4 26 * *' # early run on the 26th at 04:00 UTC
    - cron: '0 4 28 * *' # second early run on the 28th at 04:00 UTC
    - cron: '0 4 1 * *'  # fallback on the 1st at 04:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps (numpy/pandas)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.4" "pandas==1.5.3"

      - name: Download DTW matches pickle
        run: |
          set -e
          REPO="${{ vars.MATCHES_REPO }}"; REPO="${REPO:-ThomasSchinca/Pace-map-risk}"
          BRANCH="${{ vars.MATCHES_BRANCH }}"; BRANCH="${BRANCH:-main}"
          PATH_IN_REPO="${{ vars.MATCHES_PATH }}"; PATH_IN_REPO="${PATH_IN_REPO:-saved_dictionary.pkl}"
          URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH_IN_REPO}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o matches.pkl

      - name: Convert matches pickle to JSON
        run: npm run matches:convert -- --src matches.pkl --out public/data/matches.json

      - name: Generate status JSON
        run: node scripts/generate-status.js

      - name: Download full historical monthly CSV (optional)
        run: |
          set -e
          REPO="${{ vars.MATCHES_HIST_REPO }}"; REPO="${REPO:-}"
          BRANCH="${{ vars.MATCHES_HIST_BRANCH }}"; BRANCH="${BRANCH:-main}"
          PATH_IN_REPO="${{ vars.MATCHES_HIST_PATH }}"; PATH_IN_REPO="${PATH_IN_REPO:-}"
          if [ -n "$REPO" ] && [ -n "$PATH_IN_REPO" ]; then
            URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH_IN_REPO}"
            echo "Downloading full historical CSV from $URL"
            mkdir -p public/data
            curl -fsSL "$URL" -o public/data/hist_full.csv || echo "Warning: failed to download hist_full.csv"
          else
            echo "No MATCHES_HIST_REPO/PATH provided; skipping hist_full.csv"
          fi

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/matches.json public/status.json
          if [ -f public/data/hist_full.csv ]; then
            git add public/data/hist_full.csv
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): update DTW matches JSON"
            git push
          fi

      - name: Send success email
        if: ${{ success() && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' && secrets.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Update matches succeeded: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Update DTW matches</strong> completed successfully.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
            <p>Commit: ${{ github.sha }}</p>
            <p>Ref: ${{ github.ref }}</p>

      - name: Send failure email
        if: ${{ failure() && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' && secrets.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Update matches FAILED: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Update DTW matches</strong> failed.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View failed run</a></p>
            <p>Commit: ${{ github.sha }}</p>
            <p>Ref: ${{ github.ref }}</p>
