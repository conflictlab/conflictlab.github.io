name: Health Check (Live Site)

on:
  schedule:
    - cron: '0 6 24 * *' # 24th at 06:00 UTC
    - cron: '0 6 1 * *'  # 1st at 06:00 UTC
  workflow_run:
    workflows:
      - "Deploy to GitHub Pages"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compute Pages base URL
        id: base
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "url=https://${repo}" >> $GITHUB_OUTPUT
          else
            echo "url=https://${owner}.github.io/${repo}" >> $GITHUB_OUTPUT
          fi

      - name: Run live checks
        run: node scripts/check-live.js --base "${{ steps.base.outputs.url }}" --maxAgeDays 45

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.md

      - name: Open issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "Health check failed for ${{ steps.base.outputs.url }}"
          content-filepath: health-report.md
          labels: "health,bug"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Send failure email
        if: ${{ failure() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.MAIL_TO != '' && env.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || 465 }}
          secure: ${{ env.SMTP_SECURE == 'true' }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "❌ Health check FAILED: ${{ steps.base.outputs.url }}"
          to: ${{ env.MAIL_TO }}
          from: ${{ env.MAIL_FROM }}
          content_type: text/plain
          body: |
            Health check failed for ${{ steps.base.outputs.url }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
