name: Health Check (Live Site)

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_run:
    workflows:
      - "Deploy to GitHub Pages"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compute Pages base URL
        id: base
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "url=https://${repo}" >> $GITHUB_OUTPUT
          else
            echo "url=https://${owner}.github.io/${repo}" >> $GITHUB_OUTPUT
          fi

      - name: Run live checks
        run: node scripts/check-live.js --base "${{ steps.base.outputs.url }}" --maxAgeDays 45

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.md

      - name: Open issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "Health check failed for ${{ steps.base.outputs.url }}"
          content-filepath: health-report.md
          labels: "health,bug"

      - name: Send failure email
        if: ${{ failure() && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' && secrets.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Health check FAILED: ${{ steps.base.outputs.url }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          content_type: text/plain
          body: |
            Health check failed for ${{ steps.base.outputs.url }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
