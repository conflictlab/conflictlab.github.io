# Template for conflictlab/Pace-map-risk monthly generation
name: Generate Monthly Forecasts

on:
  schedule:
    - cron: '0 1 24 * *' # 24th 01:00 UTC
    - cron: '0 1 1 * *'  # 1st 01:00 UTC
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: monthly-forecasts
      cancel-in-progress: false
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run forecast generation
        run: |
          python generate_forecasts.py
          python scripts/prepare_historical_predictions.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add forecasts_h6.csv forecasts_h12.csv Hist.csv forecast_metadata.json Historical_Predictions || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: monthly forecasts"
            git push
          else
            echo "No changes"
          fi
      - name: Success email
        if: ${{ success() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.MAIL_TO != '' && env.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || 465 }}
          secure: ${{ env.SMTP_SECURE == 'true' }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "✅ Forecast generation succeeded: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ env.MAIL_TO }}
          from: ${{ env.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Generate Monthly Forecasts</strong> completed successfully.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
      - name: Failure email
        if: ${{ failure() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.MAIL_TO != '' && env.MAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || 465 }}
          secure: ${{ env.SMTP_SECURE == 'true' }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "❌ Forecast generation FAILED: ${{ github.repository }}#${{ github.run_number }}"
          to: ${{ env.MAIL_TO }}
          from: ${{ env.MAIL_FROM }}
          content_type: text/html
          html_body: |
            <p><strong>Generate Monthly Forecasts</strong> failed.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
